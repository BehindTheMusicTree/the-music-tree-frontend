# Run Playwright E2E tests against the Vercel preview deployment.
# Triggered automatically by Vercel via the GitHub Deployments API once the preview is ready.
# Results appear as a check on the PR. To gate merges on this check, add it to branch
# protection rules: Settings → Branches → main → Require status checks → "E2E — preview".
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GH_PACKAGES_TOKEN_READ           — GitHub PAT with read:packages (for @behindthemusictree/* from GitHub Packages)
#   VERCEL_AUTOMATION_BYPASS_SECRET — Vercel deployment protection bypass secret
#                                     (Project Settings → Deployment Protection → Protection Bypass for Automation)
name: E2E — preview

on:
  deployment_status:

jobs:
  playwright:
    name: Playwright tests
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Require GH_PACKAGES_TOKEN_READ secret
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Repository secret GH_PACKAGES_TOKEN_READ is required. Add a GitHub PAT with read:packages so pnpm install can install @behindthemusictree/*. GITHUB_TOKEN cannot read packages published from other repositories (403 permission_denied: read_package)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
