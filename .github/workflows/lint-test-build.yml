# Run lint, unit tests, and build on every pull request.
# Separate jobs are required individually on develop (a skipped job counts as passed, so none may
# depend on a job that is not itself required); the combined job stays required on main.
# Blocks merges if any step fails — Vercel deploys independently in parallel.
name: CI

on:
  pull_request:

jobs:
  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          BREVO_API_KEY: ci-placeholder
          BREVO_NEWSLETTER_LIST_ID: "0"
          BREVO_DOI_TEMPLATE_ID: "0"
          BREVO_DOI_REDIRECT_PATH: /newsletter/confirmed

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  build:
    name: Build Check
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          BREVO_API_KEY: ci-placeholder
          BREVO_NEWSLETTER_LIST_ID: "0"
          BREVO_DOI_TEMPLATE_ID: "0"
          BREVO_DOI_REDIRECT_PATH: /newsletter/confirmed
